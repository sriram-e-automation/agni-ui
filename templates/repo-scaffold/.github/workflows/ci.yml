name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Fail if a source change has no changeset
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -q '^src/'; then
            if ! git diff --name-only origin/main...HEAD | grep -q '^\.changeset/.*\.md$'; then
              echo "::error::src/ changed but no changeset was added. See CONTRIBUTING.md step 3."
              exit 1
            fi
          fi
