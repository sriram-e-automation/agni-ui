<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--brand-primary);display:grid;place-items:center}
.main img{width:62%;filter:brightness(0) invert(1)}
.strip{width:320px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="tile">
<div class="main"><img src="assets/logos/agniui-wordmark.svg" alt="AgniUI"></div>
<div class="strip">
<div style="background:#7ED4A4"></div>
<div style="background:#DC6803"></div>
<div style="background:#1570EF"></div>
<div style="background:#060B2E"></div>
</div>
</div>
</body>
</html>
