<!-- @dsCard group="Tailwind" viewport="1180x720" name="Button — Tailwind" subtitle="Pure-CSS states, both themes, one class table" -->
<!DOCTYPE html>
<html data-theme="light" lang="en"><head><meta charset="utf-8"><title>Button — Tailwind migration</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-subtle);min-height:100vh}
.pane{background:var(--surface-page);padding:28px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:600 11px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary);margin:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font:500 12px var(--font-sans);color:var(--text-tertiary);width:76px;flex-shrink:0}
.note{font:400 12px/1.5 var(--font-sans);color:var(--text-tertiary);max-width:46ch;margin:0}
code{font-family:var(--font-data);font-size:11px;color:var(--text-brand)}
</style></head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script>
const { Button } = window.AgniUIAgnikulERPDesignSystem_153d9e;
const h = React.createElement;
const CATS = ["primary","secondary","tertiary","ghost","danger","brand-soft"];


/* Bundle-independent proof: raw <button> elements carrying the SAME literal
   class strings the migrated component emits. If these match the component row
   above, the @theme inline bridge is resolving correctly in both modes. */
const TW_BASE = "relative inline-flex items-center justify-center min-w-[var(--min-w-control)] "
  + "font-sans font-semibold leading-none tracking-[0.005em] whitespace-nowrap select-none "
  + "border rounded-md cursor-pointer transition-[background-color,box-shadow,scale] duration-fast ease-standard "
  + "enabled:active:scale-[var(--press-scale)] focus-visible:outline-2 focus-visible:outline-offset-2 "
  + "focus-visible:outline-action-brand disabled:cursor-not-allowed disabled:opacity-[var(--state-disabled-opacity)] "
  + "h-9.5 px-4 gap-2 text-base";
const TW_CAT = {
  primary: "bg-action-brand text-fg-on-brand border-transparent shadow-e-xs enabled:hover:bg-action-brand-hover enabled:hover:shadow-e-sm enabled:active:bg-action-brand-press",
  secondary: "bg-surface-card text-fg-secondary border-line-default shadow-e-xs enabled:hover:bg-surface-soft enabled:hover:shadow-e-sm enabled:active:bg-surface-sunken",
  tertiary: "bg-transparent text-fg-brand border-transparent enabled:hover:bg-surface-brand-soft enabled:active:bg-[var(--agni-green-100)]",
  ghost: "bg-transparent text-fg-secondary border-transparent enabled:hover:bg-state-hover enabled:active:bg-state-press",
  danger: "bg-[var(--button-danger-bg,var(--status-error))] text-fg-on-brand border-transparent shadow-e-xs enabled:hover:bg-[var(--button-danger-bg-hover,var(--status-error-hover))] enabled:active:bg-[var(--button-danger-bg-press,var(--status-error-press))]",
  "brand-soft": "bg-surface-brand-soft text-fg-brand border-transparent enabled:hover:bg-[var(--agni-green-100)] enabled:active:bg-[var(--agni-green-200)]",
};

function Row(label, kids){ return h("div",{className:"row"},h("span",{className:"lbl"},label),...kids); }

function Pane({ dark }){
  return h("div",{className:"pane","data-theme":dark?"dark":undefined},
    h("p",{className:"eyebrow"}, dark ? "Dark — same classes, no dark: variant" : "Light"),
    Row("Component", CATS.map(c=>h(Button,{key:c,category:c},c))),
    Row("Raw classes", CATS.map(c=>h("button",{key:c,className:TW_BASE+" "+TW_CAT[c]},c))),
    Row("Sizes", ["sm","md","lg"].map(s=>h(Button,{key:s,size:s},s))),
    Row("With icon", [
      h(Button,{key:1,icon:h("i",{className:"ph ph-plus"})},"New record"),
      h(Button,{key:2,category:"secondary",iconTrailing:h("i",{className:"ph ph-caret-down"})},"Filter"),
    ]),
    Row("States", [
      h(Button,{key:1,disabled:true},"Disabled"),
      h(Button,{key:2,loading:true},"Saving"),
      h(Button,{key:3,category:"secondary",title:"Icon-only with tooltip",icon:h("i",{className:"ph ph-export"})}),
    ]),
    Row("Block", [h("div",{style:{flex:1}},h(Button,{block:true,category:"brand-soft"},"Full width"))]),
    h("p",{className:"note"}, dark
      ? "Every swatch here resolves through @theme inline — the class strings are byte-identical to the light pane."
      : "Component row = the bundle. Raw-classes row = literal Tailwind strings, independent of the bundle. They must match."),
  );
}

/* Compile the DS's Tailwind config in-browser so this card previews without a
   build step. Production consumers link the prebuilt agniui.css instead.
   This MUST finish before React renders: the browser build styles nodes as it
   sees them, so anything already in the DOM at injection time stays unstyled. */
(async () => {
  const theme = await fetch("./agniui.theme.css").then(r => r.text());
  const s = document.createElement("style");
  s.type = "text/tailwindcss";
  s.textContent = '@import "tailwindcss";\n' + theme;
  document.head.appendChild(s);
  await new Promise(done => {
    const tw = document.createElement("script");
    tw.src = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4";
    tw.onload = done; tw.onerror = done;
    document.head.appendChild(tw);
  });
  await new Promise(r => setTimeout(r, 150));
  ReactDOM.createRoot(document.getElementById("root")).render(
    h("div", { className: "wrap" }, h(Pane, { dark: false }), h(Pane, { dark: true }))
  );
})();
</script>
</body></html>
