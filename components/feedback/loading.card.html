<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.cap{font:var(--fw-bold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-brand);margin:22px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}.cap:first-child{margin-top:0}.lbl{font:var(--fw-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px}.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}</style>
</head><body><div id="root"></div>

  const [busy, setBusy] = React.useState(true);
  return (<div>
    <div className="cap">Data — shape-matched skeletons</div>
    <div className="g2">
      <Cell name='shape="table"'><Loading shape="table" rows={4} columns={4}/></Cell>

          <Loading shape="avatar"/><Loading shape="tag"/><Loading shape="button"/>
        </div>

<Loading loading={refreshing} overlay><RecordsGrid/></Loading>`}</pre>

  </div>);
