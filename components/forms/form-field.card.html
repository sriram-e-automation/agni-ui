<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><title>FormField & FormSection</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page)}.cap{font:var(--fw-bold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-brand);margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}.cap:first-child{margin-top:0}.lbl{font:var(--fw-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px}.note{font:var(--fw-regular) var(--text-xs)/1.5 var(--font-sans);color:var(--text-tertiary);margin:8px 0 0;max-width:64ch}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.pane{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { FormField, FormSection, Input, Select, Textarea, DatePicker } = window.AgniUIAgnikulERPDesignSystem_153d9e;
function Demo(){
  const [a,setA]=React.useState("");
  const [b,setB]=React.useState("REC-2401");
  const [c,setC]=React.useState("");
  return (<div>
    <div className="cap">FormField states</div>
    <div className="pane" style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:"var(--field-gap-x, 18px) 18px"}}>
      <FormField label="Record title"><Input value={a} onChange={setA} placeholder="Short description"/></FormField>
      <FormField label="Record ID" required><Input value={b} onChange={setB}/></FormField>
      <FormField label="Category" hint="Drives which approval chain the record enters"><Select value="" onChange={()=>{}} options={["Avionics","Propulsion","Structures"]} placeholder="Select category"/></FormField>
      <FormField label="Quantity" required error="Enter a quantity greater than zero"><Input value="0" onChange={()=>{}} error/></FormField>
      <FormField label="Cost centre" hint="Locked by your role"><Input value="CC-1180" onChange={()=>{}} disabled/></FormField>
      <FormField label="Needed by"><DatePicker value={null} onChange={()=>{}} placeholder="Pick a date"/></FormField>
      <FormField label="Justification" span hint="Visible to every approver on the chain"><Textarea value={c} onChange={setC} rows={3} placeholder="Why is this needed?"/></FormField>
    </div>
    <p className="note"><b>error replaces hint</b> — never stack both. Required is the label asterisk, not a hint sentence. <code>span</code> makes a field take the whole row, which is right for prose and item tables and wrong for short values.</p>
    <div className="cap">FormSection — heading + grid</div>
    <div className="pane">
      <FormSection title="Request details" desc="What is being asked for, and under which budget." cols={2}>
        <FormField label="Request type" required><Select value="purchase" onChange={()=>{}} options={[{value:"purchase",label:"Purchase request"},{value:"service",label:"Service request"}]}/></FormField>
        <FormField label="Priority"><Select value="med" onChange={()=>{}} options={[{value:"high",label:"High"},{value:"med",label:"Medium"},{value:"low",label:"Low"}]}/></FormField>
        <FormField label="Tags" span><Select multiple value={["avionics"]} onChange={()=>{}} options={[{value:"avionics",label:"Avionics"},{value:"flight",label:"Flight critical"},{value:"ground",label:"Ground systems"}]}/></FormField>
      </FormSection>
      <div style={{height:22}}></div>
      <FormSection title="Delivery" desc="Three columns for short, same-shaped values." cols={3}>
        <FormField label="Site"><Select value="chennai" onChange={()=>{}} options={[{value:"chennai",label:"Chennai HQ"},{value:"shar",label:"Sriharikota"}]}/></FormField>
        <FormField label="Bay"><Input value="B-04" onChange={()=>{}}/></FormField>
        <FormField label="Contact"><Input value="" onChange={()=>{}} placeholder="Name"/></FormField>
      </FormSection>
    </div>
    <p className="note">Sections own the grid; fields never set their own width. <code>cols={2}</code> is the default rhythm — go to 3 only for short uniform values. Below the desktop breakpoint both collapse to one column automatically.</p>
    <div className="cap">Usage</div>
    <pre style={{fontFamily:"var(--font-data)",fontSize:"var(--text-xs)",background:"var(--surface-page)",border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:14,overflow:"auto"}}>{`<FormSection title="Request details" desc="What is being asked for." cols={2}>
  <FormField label="Request type" required><Select .../></FormField>
  <FormField label="Justification" span hint="Visible to every approver"><Textarea .../></FormField>
</FormSection>`}</pre>
    <div className="cap">Responsive</div>
    <table style={{borderCollapse:"collapse",width:"100%",marginBottom:14}}><tbody>
      <tr><th style={{textAlign:"left",fontSize:"var(--text-2xs)",color:"var(--text-tertiary)",paddingBottom:8,borderBottom:"1px solid var(--border-subtle)",width:"18%"}}>Breakpoint</th><th style={{textAlign:"left",fontSize:"var(--text-2xs)",color:"var(--text-tertiary)",paddingBottom:8,borderBottom:"1px solid var(--border-subtle)"}}>Behavior</th></tr>
      <tr><td style={{padding:"9px 12px 9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)"}}><strong>Desktop ≥ 1024</strong></td><td style={{padding:"9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)",color:"var(--text-secondary)"}}><code>cols={2}</code>/<code>cols={3}</code> render at full width via <code>repeat(auto-fit, minmax(var(--field-min), 1fr))</code>.</td></tr>
      <tr><td style={{padding:"9px 12px 9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)"}}><strong>Tablet / Phone &lt; 1024</strong></td><td style={{padding:"9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)",color:"var(--text-secondary)"}}>The grid auto-collapses to one column once a track would go under <code>--field-min</code> (260px) — no prop change needed. <code>span</code> fields already take the full row at every width.</td></tr>
    </tbody></table>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
