</head><body><div id="root"></div>
<script type="text/babel">
const { AppShell, Bar, Cluster, Stack, Button, Tag, Avatar } = window.AgniUIAgnikulERPDesignSystem_153d9e;
function MiniNav(){
  const items=[["ph-squares-four","Overview",false],["ph-rows","Records",true],["ph-kanban","Board",false]];
  return <div style={{height:"100%",background:"var(--surface-card)",borderRight:"1px solid var(--border-subtle)",padding:"8px 0"}}>
    {items.map(([ic,l,on])=><div key={l} style={{display:"flex",alignItems:"center",gap:10,margin:"1px 8px",padding:"9px 14px",borderRadius:"var(--radius-md)",fontSize:"var(--text-sm)",fontWeight:on?"var(--fw-semibold)":"var(--fw-medium)",background:on?"var(--action-brand)":"transparent",color:on?"var(--text-on-brand)":"var(--text-secondary)"}}><i className={"ph "+ic} style={{fontSize:18}}/>{l}</div>)}
  </div>;
}
function Demo(){
  return (<div>
    <div className="lbl">AppShell — header · sidebar · content · footer</div>
    <div style={{height:200,border:"1px solid var(--border-default)",borderRadius:"var(--radius-lg)",overflow:"hidden",marginBottom:16}}>
      <AppShell
        sidebarWidth="160px"
        header={<Bar position="top"><Cluster gap="tight"><span style={{width:26,height:26,borderRadius:"var(--radius-sm)",background:"var(--action-brand)",color:"var(--text-on-brand)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><i className="ph-bold ph-squares-four"/></span><strong style={{fontSize:"var(--text-sm)"}}>Records</strong></Cluster><Cluster gap="tight"><Button iconOnly icon={<i className="ph ph-bell"/>} variant="outline" round size="sm"/><Avatar name="Aravind P" size="sm" online/></Cluster></Bar>}
        sidebar={<MiniNav/>}
        contentPad="14px"
        footer={<Bar position="footer"><span style={{fontSize:"var(--text-2xs)",color:"var(--text-tertiary)"}}>Agnikul Cosmos</span><span style={{fontSize:"var(--text-2xs)",color:"var(--text-tertiary)"}}>v1.0.0</span></Bar>}>
        <Stack gap="tight"><strong style={{fontSize:"var(--text-base)"}}>Content region</strong><span style={{fontSize:"var(--text-sm)",color:"var(--text-secondary)"}}>Panes own their padding; the shell handles the frame.</span></Stack>
      </AppShell>
    </div>
    <div className="lbl">Cluster (justify=between) &nbsp;·&nbsp; Stack</div>
    <Cluster justify="between" style={{border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:10,background:"var(--surface-card)"}}>
      <Cluster gap="tight"><Tag tone="brand">Cluster</Tag><span style={{fontSize:"var(--text-sm)",color:"var(--text-secondary)"}}>row · token gaps</span></Cluster>
      <Button size="sm" category="secondary">Action</Button>
    </Cluster>
    <div className="lbl" style={{marginTop:20}}>Usage &amp; responsive</div>
    <pre style={{fontFamily:"var(--font-data)",fontSize:"var(--text-xs)",background:"var(--surface-card)",border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:14,overflow:"auto",margin:"0 0 10px"}}>{`<AppShell header={<Bar position="top">…</Bar>} sidebar={<NavRail .../>} sidebarWidth={railOpen?"248px":"72px"}>
  {content}
</AppShell>`}</pre>
    <p style={{fontSize:"var(--text-xs)",color:"var(--text-tertiary)",lineHeight:1.6,margin:0,maxWidth:"74ch"}}>Desktop ≥ 1024: 12-col grid, sidebar 248px (or 72px collapsed). Tablet 640–1023: 8-col, sidebar forced to the 72px icon rail. Phone &lt; 640: 4-col, <code>sidebarWidth</code> should be 0 and the sidebar passed as a <code>NavRail overlay</code> instead — AppShell itself doesn't switch this automatically, the host picks the mode per breakpoint. Full breakpoint reference: Foundations › Layout, grid &amp; breakpoints.</p>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
