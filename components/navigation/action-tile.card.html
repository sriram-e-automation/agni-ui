<!-- @dsCard group="Navigation" viewport="1000x760" name="ActionTile — module launchpad" subtitle="Default · badge · tone · disabled · a landing-page row — and when to reach for OptionRow instead" -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><title>ActionTile</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.cap{font:var(--fw-bold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-brand);margin:22px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}.cap:first-child{margin-top:0}.lbl{font:var(--fw-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px}.note{font:var(--fw-regular) var(--text-xs)/1.5 var(--font-sans);color:var(--text-tertiary);margin:10px 0 0;max-width:74ch}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.dk{background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { ActionTile, OptionRow, Button } = window.AgniUIAgnikulERPDesignSystem_153d9e;

function Demo(){
  const [last,setLast]=React.useState(null);
  if (!ActionTile) return <div style={{padding:24,color:"var(--text-tertiary)",font:"var(--text-sm) var(--font-sans)"}}>Compiling design-system bundle… reload in a moment.</div>;
  return (<div>
    <div className="cap">The launchpad row — how a module landing page opens</div>
    <div className="g4">
      <ActionTile icon="ph-plus-circle" title="New record" desc="Raise a purchase, service or travel request." onClick={()=>setLast("New record")}/>
      <ActionTile icon="ph-tray" title="My requests" desc="Everything you have raised." badge={12} onClick={()=>setLast("My requests")}/>
      <ActionTile icon="ph-seal-check" title="Approvals" desc="Waiting on your decision." badge={4} tone="var(--status-warning)" onClick={()=>setLast("Approvals")}/>
      <ActionTile icon="ph-chart-line" title="Reports" desc="Spend and cycle time by period." onClick={()=>setLast("Reports")}/>
    </div>
    <p className="note">Four is the comfortable maximum on one row at desk width — a launchpad is a set of doors, not a menu. The trailing arrow reacts on hover; the whole tile is the target. {last && <span style={{color:"var(--text-brand)"}}>Opened: {last}</span>}</p>

    <div className="cap">States</div>
    <div className="g3">
      <div><div className="lbl">Default</div><ActionTile icon="ph-package" title="Inventory" desc="Stock on hand by store." onClick={()=>{}}/></div>
      <div><div className="lbl">With a count badge</div><ActionTile icon="ph-warning-circle" title="Exceptions" desc="Rows that need attention." badge={7} tone="var(--status-error)" onClick={()=>{}}/></div>
      <div><div className="lbl">Disabled — no permission, no target</div><ActionTile icon="ph-lock-simple" title="Payroll" desc="Restricted to Finance Ops." disabled/></div>
    </div>
    <p className="note">
      <code>disabled</code> is drawn on the wrapper rather than through <code>:disabled</code>, because the tile is
      a <code>&lt;div&gt;</code> and has no such state. For a tile the viewer's role cannot reach at all, wrap it
      in <code>&lt;RoleGate&gt;</code> and show nothing — the disabled look is for a target that exists but is
      temporarily closed.
    </p>

    <div className="cap">Tones</div>
    <div className="g4">
      <ActionTile icon="ph-flame" title="Brand" desc="The default accent." onClick={()=>{}}/>
      <ActionTile icon="ph-check-circle" title="Success" desc="Completed work." tone="var(--status-success)" onClick={()=>{}}/>
      <ActionTile icon="ph-clock" title="Pending" desc="Waiting on someone." tone="var(--status-pending)" onClick={()=>{}}/>
      <ActionTile icon="ph-prohibit" title="Blocked" desc="Stopped elsewhere." tone="var(--status-blocked)" onClick={()=>{}}/>
    </div>
    <p className="note"><code>tone</code> takes a token, never a literal hex — it is fed through <code>color-mix</code> for the icon wash, so any status token works and themes with the rest of the system.</p>

    <div className="cap">ActionTile or OptionRow?</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <div>
        <div className="lbl">ActionTile — a way in</div>
        <ActionTile icon="ph-user-plus" title="Onboarding" desc="Start a joiner's paperwork." onClick={()=>{}}/>
        <p className="note">A landing-page entry point. Big target, one line of description, goes somewhere.</p>
      </div>
      <div>
        <div className="lbl">OptionRow — an item in a list</div>
        <div style={{display:"grid",gap:10}}>
          <OptionRow icon="ph-user-plus" title="Onboarding" desc="Review onboarding information." note="Onboarded date:" value="12 Feb 2024" onClick={()=>{}}/>
          <OptionRow icon="ph-sign-out" title="Exit process" desc="No exit process initiated." note="Status:" value="Initiate" valueIcon="ph-plus-circle" onClick={()=>{}}/>
        </div>
        <p className="note">A row among peers, with a note/value footer. Full variants are on the <b>record-detail</b> card in the Data group.</p>
      </div>
    </div>

    <div className="cap">Dark</div>
    <div className="dk" data-theme="dark">
      <div className="g3">
        <ActionTile icon="ph-plus-circle" title="New record" desc="Raise a request." onClick={()=>{}}/>
        <ActionTile icon="ph-seal-check" title="Approvals" desc="Waiting on you." badge={4} tone="var(--status-warning)" onClick={()=>{}}/>
        <ActionTile icon="ph-lock-simple" title="Payroll" desc="Restricted." disabled/>
      </div>
    </div>
    <div className="cap">Usage</div>
    <pre style={{fontFamily:"var(--font-data)",fontSize:"var(--text-xs)",background:"var(--surface-page)",border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:14,overflow:"auto"}}>{`<ActionTile icon="ph-plus-circle" title="New record" desc="Raise a purchase request."
  badge={4} tone="var(--status-warning)" onClick={openForm}/>`}</pre>
    <div className="cap">Responsive</div>
    <table style={{borderCollapse:"collapse",width:"100%",marginBottom:14}}><tbody>
      <tr><th style={{textAlign:"left",fontSize:"var(--text-2xs)",color:"var(--text-tertiary)",paddingBottom:8,borderBottom:"1px solid var(--border-subtle)",width:"18%"}}>Breakpoint</th><th style={{textAlign:"left",fontSize:"var(--text-2xs)",color:"var(--text-tertiary)",paddingBottom:8,borderBottom:"1px solid var(--border-subtle)"}}>Behavior</th></tr>
      <tr><td style={{padding:"9px 12px 9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)"}}><strong>Desktop ≥ 1024</strong></td><td style={{padding:"9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)",color:"var(--text-secondary)"}}>Four tiles per row is the comfortable maximum (<code>.g4</code> above) — the tile itself has no column logic; the host's grid decides the count.</td></tr>
      <tr><td style={{padding:"9px 12px 9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)"}}><strong>Tablet / Phone &lt; 1024</strong></td><td style={{padding:"9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)",color:"var(--text-secondary)"}}>Drop the host grid to 2 columns on tablet, 1 on phone (<code>grid-template-columns</code>) — the tile fills its cell either way and its description wraps rather than truncating.</td></tr>
    </tbody></table>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
