<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><title>DropdownMenu</title>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--surface-page)}.cap{font:var(--fw-bold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-brand);margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border-subtle)}.cap:first-child{margin-top:0}.lbl{font:var(--fw-semibold) var(--text-2xs)/1 var(--font-sans);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 8px}.note{font:var(--fw-regular) var(--text-xs)/1.5 var(--font-sans);color:var(--text-tertiary);margin:6px 0 0;max-width:60ch}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.dk{background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DropdownMenu, Button, Avatar } = window.AgniUIAgnikulERPDesignSystem_153d9e;
const BASIC=[{label:"View"},{label:"Edit"},{label:"Duplicate"}];
const ICONS=[{label:"View request",icon:"ph-eye"},{label:"Edit",icon:"ph-pencil-simple"},{label:"Duplicate",icon:"ph-copy"},"divider",{label:"Export CSV",icon:"ph-download-simple"}];
const DANGER=[{label:"Reassign",icon:"ph-user-switch"},{label:"Put on hold",icon:"ph-pause"},"divider",{label:"Terminate",icon:"ph-prohibit",danger:true},{label:"Delete record",icon:"ph-trash",danger:true}];
function Demo(){
  return (<div>
    <div className="cap">Item kinds</div>
    <div className="row">
      <div><div className="lbl">Labels only</div><DropdownMenu trigger={<Button category="secondary" icon={<i className="ph ph-caret-down"/>}>Actions</Button>} items={BASIC}/></div>
      <div><div className="lbl">Icons + divider</div><DropdownMenu trigger={<Button category="secondary" icon={<i className="ph ph-caret-down"/>}>Row actions</Button>} items={ICONS}/></div>
      <div><div className="lbl">Danger items</div><DropdownMenu trigger={<Button category="secondary" icon={<i className="ph ph-caret-down"/>}>Employee</Button>} items={DANGER}/></div>
    </div>
    <p className="note">Danger items carry the error tone and sit last, below a divider. Cap a menu at ~8 rows; beyond that use a <code>CommandPalette</code>.</p>
    <div className="cap">Triggers</div>
    <div className="row" style={{alignItems:"center"}}>
      <div><div className="lbl">⋮ icon button — page title & table rows</div><DropdownMenu trigger={<Button iconOnly icon="ph-dots-three-vertical" title="More"/>} items={ICONS}/></div>
      <div><div className="lbl">Avatar — profile menu</div><DropdownMenu align="end" trigger={<span style={{cursor:"pointer",display:"inline-flex"}}><Avatar name="Aravind Prabhu" size="sm"/></span>} items={[{label:"My profile",icon:"ph-user"},{label:"Preferences",icon:"ph-sliders-horizontal"},"divider",{label:"Sign out",icon:"ph-sign-out"}]}/></div>
      <div><div className="lbl">Primary button</div><DropdownMenu trigger={<Button category="primary" icon={<i className="ph ph-plus"/>}>New</Button>} items={[{label:"New record",icon:"ph-file-plus"},{label:"Import records",icon:"ph-upload-simple"}]}/></div>
    </div>
    <div className="cap">Alignment</div>
    <div style={{display:"flex",justifyContent:"space-between"}}>
      <div><div className="lbl">align="start" (default)</div><DropdownMenu align="start" trigger={<Button category="secondary">Opens right</Button>} items={BASIC}/></div>
      <div style={{textAlign:"right"}}><div className="lbl">align="end" — near the right edge</div><DropdownMenu align="end" trigger={<Button category="secondary">Opens left</Button>} items={BASIC}/></div>
    </div>
    <p className="note">Click a trigger to open; the menu closes on outside click or selection. It floats at <code>--z-dropdown</code>.</p>
    <div className="cap">Usage</div>
    <pre style={{fontFamily:"var(--font-data)",fontSize:"var(--text-xs)",background:"var(--surface-soft)",border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:14,overflow:"auto"}}>{`<DropdownMenu align="end" trigger={<Button iconOnly icon="ph-dots-three-vertical"/>}
  items={[{label:"Edit",icon:"ph-pencil-simple"},"divider",{label:"Delete",icon:"ph-trash",danger:true}]}/>`}</pre>
    <div className="cap">Responsive</div>
    <table style={{borderCollapse:"collapse",width:"100%",marginBottom:14}}><tbody>
      <tr><th style={{textAlign:"left",fontSize:"var(--text-2xs)",color:"var(--text-tertiary)",paddingBottom:8,borderBottom:"1px solid var(--border-subtle)",width:"18%"}}>Breakpoint</th><th style={{textAlign:"left",fontSize:"var(--text-2xs)",color:"var(--text-tertiary)",paddingBottom:8,borderBottom:"1px solid var(--border-subtle)"}}>Behavior</th></tr>
      <tr><td style={{padding:"9px 12px 9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)"}}><strong>All sizes</strong></td><td style={{padding:"9px 0",borderBottom:"1px solid var(--border-subtle)",fontSize:"var(--text-xs)",color:"var(--text-secondary)"}}>The menu is a fixed-width popover anchored to its trigger and clamped to the viewport — it never overflows the right/bottom edge on a narrow screen, but it does not become a bottom sheet on phone. For a very long list on a touch device, prefer <code>CommandPalette</code>.</td></tr>
    </tbody></table>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
