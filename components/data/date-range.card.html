<script type="text/babel">
const { DateRangeFilter } = window.AgniUIAgnikulERPDesignSystem_153d9e || {};
const computePeriod = DateRangeFilter && DateRangeFilter.computePeriod;
const now = new Date(2026,7,17);
const monthNow = computePeriod ? (()=>{ const p=computePeriod("month",0,now); return {start:p.start,end:p.end,label:p.lbl,gran:"month",gOffset:0}; })() : null;
const quarterBack = computePeriod ? (()=>{ const p=computePeriod("quarter",-1,now); return {start:p.start,end:p.end,label:p.lbl,gran:"quarter",gOffset:-1}; })() : null;

  const [b,setB]=React.useState(monthNow);
  const [c,setC]=React.useState(quarterBack);
  const [d,setD]=React.useState(null);
  return (<div>
    <div className="cap">States</div>
    <div className="row">
      <div><div className="lbl">Idle — no range set</div><div className="pane"><DateRangeFilter value={a} onChange={setA}/></div></div>

      <div><div className="lbl">Active — a past quarter</div><div className="pane"><DateRangeFilter value={c} onChange={setC}/></div></div>
    </div>
    <p className="note">Idle is an outline calendar button. Once a range is set the trigger shows the period label and gains an × to clear. Click any trigger to open the panel: granularity tabs (Week · Month · Quarter · Year) on top, ← period → navigator below, custom From→To at the foot — so any past or future period is two clicks away.</p>
    <div className="cap">Phone — isPhone</div>
    <div className="lbl">The panel centers as a scrimmed dialog instead of anchoring to the trigger</div>
    <div className="pane" style={{width:320}}><DateRangeFilter value={d} onChange={setD} isPhone/></div>
    <p className="note">In a page toolbar you rarely mount this directly — <code>PageControls</code> composes it and forwards <code>isPhone</code>. Mount it standalone only on a surface with no records toolbar.</p>
    <div className="cap">Usage</div>
    <pre style={{fontFamily:"var(--font-data)",fontSize:"var(--text-xs)",background:"var(--surface-page)",border:"1px solid var(--border-subtle)",borderRadius:"var(--radius-md)",padding:14,overflow:"auto"}}>{`<DateRangeFilter value={range} onChange={setRange} isPhone={isPhone}/>`}</pre>
    <div className="cap">Responsive</div>
    <p className="note" style={{maxWidth:"72ch"}}>Desktop/tablet: anchored popover clamped to the viewport (see the <code>window.innerWidth</code> clamp in <code>DateRangeFilter.tsx</code>). Pass <code>isPhone</code> below ~640px and the same panel centers as a scrimmed dialog instead — the host decides when to flip it, the component doesn't watch its own width.</p>
  </div>);
