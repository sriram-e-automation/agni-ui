<!-- @dsCard group="Accessibility" viewport="700x200" name="Focus & contrast" subtitle="Solid 2px brand ring · AA minimums validated per mode" -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{height:38px;padding:0 16px;border-radius:var(--radius-md);border:1px solid transparent;font-weight:600;font-size:var(--text-sm);display:inline-flex;align-items:center;cursor:pointer}
.fr{box-shadow:var(--focus-ring)}
.fre{box-shadow:var(--focus-ring-error)}
.note{font-size:var(--text-xs);color:var(--text-tertiary);margin-top:14px;line-height:1.5}
code{font-family:var(--font-data);color:var(--text-secondary)}</style></head><body>
<div class="row">
  <button class="btn fr" style="background:var(--action-brand);color:#fff">Focus ring (brand)</button>
  <button class="btn fre" style="background:var(--surface-card);color:var(--text-secondary);border-color:var(--input-bdr-error)">Focus ring (error)</button>
  <span style="font-size:var(--text-xs);font-weight:600;color:#fff;background:var(--status-success);padding:4px 10px;border-radius:var(--radius-full)">AA on solid</span>
</div>
<div class="note">
  Targets: body text <code>≥ 4.5:1</code> · large/bold <code>≥ 3:1</code> · borders, icons & the focus indicator <code>≥ 3:1</code>.<br>
  Focus is a <code>2px</code>-min visible indicator (<code>--focus-ring</code>), never removed without replacement. Dark-mode values are validated independently — a pass in light is not assumed in dark.
</div>
</body></html>
