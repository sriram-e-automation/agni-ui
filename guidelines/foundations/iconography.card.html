<!-- @dsCard group="Brand" viewport="700x180" name="Iconography — Phosphor weights" subtitle="regular=default · bold=emphasis · fill=active/selected · duotone=accent" -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:26px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;width:130px}
.icons{display:flex;gap:12px;font-size:24px;color:var(--text-secondary)}
.h{font-size:var(--text-2xs);font-weight:600;color:var(--text-primary)}
.u{font-size:var(--text-2xs);color:var(--text-tertiary);font-family:var(--font-data);text-align:center}</style></head><body>
<div class="row">
  <div class="col"><div class="icons"><i class="ph ph-rocket"></i><i class="ph ph-funnel"></i><i class="ph ph-gear"></i></div><span class="h">regular</span><span class="u">default actions</span></div>
  <div class="col"><div class="icons"><i class="ph-bold ph-rocket"></i><i class="ph-bold ph-squares-four"></i><i class="ph-bold ph-check"></i></div><span class="h">bold</span><span class="u">emphasis / brand</span></div>
  <div class="col"><div class="icons" style="color:var(--action-brand)"><i class="ph-fill ph-check-circle"></i><i class="ph-fill ph-seal-check"></i><i class="ph-fill ph-star"></i></div><span class="h">fill</span><span class="u">active / selected</span></div>
  <div class="col"><div class="icons" style="color:var(--action-brand)"><i class="ph-duotone ph-chart-bar"></i><i class="ph-duotone ph-cube"></i><i class="ph-duotone ph-factory"></i></div><span class="h">duotone</span><span class="u">rich accents</span></div>
</div>
</body></html>
