<!-- @dsCard group="Spacing" viewport="860x190" name="Spacing scale" subtitle="8-point system · 4px half-steps · space-1 → space-20" -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;align-items:flex-end;gap:16px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--action-brand);border-radius:var(--radius-xs)}
.bar.half{background:var(--agni-green-300)}
.l{font-size:var(--text-2xs);font-family:var(--font-data);color:var(--text-tertiary)}
.leg{margin-top:14px;font-size:var(--text-2xs);font-family:var(--font-data);color:var(--text-tertiary);display:flex;gap:16px;align-items:center}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:5px}</style></head><body>
<div class="row">
  <div class="col"><div class="bar half" style="width:4px;height:4px"></div><span class="l">1·4</span></div>
  <div class="col"><div class="bar" style="width:8px;height:8px"></div><span class="l">2·8</span></div>
  <div class="col"><div class="bar half" style="width:12px;height:12px"></div><span class="l">3·12</span></div>
  <div class="col"><div class="bar" style="width:16px;height:16px"></div><span class="l">4·16</span></div>
  <div class="col"><div class="bar half" style="width:20px;height:20px"></div><span class="l">5·20</span></div>
  <div class="col"><div class="bar" style="width:24px;height:24px"></div><span class="l">6·24</span></div>
  <div class="col"><div class="bar" style="width:32px;height:32px"></div><span class="l">8·32</span></div>
  <div class="col"><div class="bar" style="width:40px;height:40px"></div><span class="l">10·40</span></div>
  <div class="col"><div class="bar" style="width:48px;height:48px"></div><span class="l">12·48</span></div>
  <div class="col"><div class="bar" style="width:64px;height:64px"></div><span class="l">16·64</span></div>
  <div class="col"><div class="bar" style="width:80px;height:80px"></div><span class="l">20·80</span></div>
</div>
<div class="leg"><span><span class="sw" style="background:var(--action-brand)"></span>8-point majors — structural rhythm (gutters, pane gaps, sections)</span><span><span class="sw" style="background:var(--agni-green-300)"></span>4px half-steps — dense micro-spacing (icon↔label, chips, cells)</span></div>
</body></html>
