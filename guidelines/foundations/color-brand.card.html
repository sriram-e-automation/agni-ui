<!-- @dsCard group="Colors" viewport="700x150" name="Brand & action" subtitle="Layer 1 brand token → action color. Change --brand-primary to re-theme." -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:120px;height:84px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box}
.n{font-size:var(--text-2xs);font-weight:var(--fw-semibold);font-family:var(--font-data)}
.v{font-size:var(--text-2xs);font-family:var(--font-data);opacity:.85}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--brand-primary);color:#fff"><span class="n">--brand-primary</span><span class="v">#3F7343</span></div>
  <div class="sw" style="background:var(--brand-primary-tint);color:#fff"><span class="n">--brand-primary-tint</span><span class="v">#5C8A58</span></div>
  <div class="sw" style="background:var(--brand-primary-shade);color:#fff"><span class="n">--brand-primary-shade</span><span class="v">#335C36</span></div>
  <div class="sw" style="background:var(--brand-accent);color:#16302a"><span class="n">--brand-accent</span><span class="v">#7ED4A4</span></div>
  <div class="sw" style="background:var(--brand-primary-wash);color:var(--brand-primary)"><span class="n">--brand-primary-wash</span><span class="v">#EEF4EC</span></div>
  <div class="sw" style="background:var(--brand-navy);color:#fff"><span class="n">--brand-navy</span><span class="v">#060B2E</span></div>
</div>
</body></html>
