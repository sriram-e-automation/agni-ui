<!-- @dsCard group="Spacing" viewport="700x180" name="Density modes" subtitle="compact (default) · comfortable · spacious — via data-density" -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-sans)}
.cols{display:flex;gap:14px}
.col{flex:1}
.h{font-size:var(--text-2xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--text-tertiary);margin-bottom:8px}
.tbl{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
.cell{padding:var(--density-cell-pad) 12px;border-bottom:1px solid var(--border-subtle);font-size:var(--text-sm);color:var(--text-secondary)}
.cell:last-child{border:0}</style></head><body>
<div class="cols">
  <div class="col" data-density="compact"><div class="h">compact (default)</div><div class="tbl"><div class="cell">WO-00318</div><div class="cell">WO-00319</div><div class="cell">WO-00320</div></div></div>
  <div class="col"><div class="h">comfortable</div><div class="tbl"><div class="cell">WO-00318</div><div class="cell">WO-00319</div><div class="cell">WO-00320</div></div></div>
  <div class="col" data-density="spacious"><div class="h">spacious</div><div class="tbl"><div class="cell">WO-00318</div><div class="cell">WO-00319</div><div class="cell">WO-00320</div></div></div>
</div>
</body></html>
