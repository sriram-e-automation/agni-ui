<!-- @dsCard group="Spacing" viewport="700x150" name="Shape — corner radii" subtitle="Conservative, functional. Not expressive." -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:72px;height:56px;background:var(--surface-card);border:1.5px solid var(--action-brand)}
.l{font-size:var(--text-2xs);font-family:var(--font-data);color:var(--text-tertiary)}</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="l">xs · 4</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="l">sm · 6</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="l">md · 8</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="l">lg · 12</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="l">xl · 16</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="l">2xl · 24</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-full);width:56px"></div><span class="l">full</span></div>
</div>
</body></html>
