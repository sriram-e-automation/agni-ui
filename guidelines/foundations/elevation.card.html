<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation — shadows" subtitle="Re-tuned for dark. Reserved for floating layers." -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:22px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:92px;height:60px;background:var(--surface-card);border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
.l{font-size:var(--text-2xs);font-family:var(--font-data);color:var(--text-tertiary)}</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="l">xs · cards</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="l">sm</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="l">md · hover</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="l">lg · menus</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="l">xl · popovers</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-2xl)"></div><span class="l">2xl · modals</span></div>
</div>
</body></html>
