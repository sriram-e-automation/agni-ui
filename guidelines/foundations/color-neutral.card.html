<!-- @dsCard group="Colors" viewport="700x150" name="Neutral / surface scale" subtitle="Slate-neutral ramp — text, borders, surfaces" -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:0;flex-wrap:nowrap;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
.sw{flex:1;height:80px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
.n{font-size:9px;font-family:var(--font-data);font-weight:var(--fw-semibold)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--agni-neutral-25);color:#16191D"><span class="n">25</span></div>
  <div class="sw" style="background:var(--agni-neutral-50);color:#16191D"><span class="n">50</span></div>
  <div class="sw" style="background:var(--agni-neutral-100);color:#16191D"><span class="n">100</span></div>
  <div class="sw" style="background:var(--agni-neutral-200);color:#16191D"><span class="n">200</span></div>
  <div class="sw" style="background:var(--agni-neutral-300);color:#16191D"><span class="n">300</span></div>
  <div class="sw" style="background:var(--agni-neutral-400);color:#fff"><span class="n">400</span></div>
  <div class="sw" style="background:var(--agni-neutral-500);color:#fff"><span class="n">500</span></div>
  <div class="sw" style="background:var(--agni-neutral-600);color:#fff"><span class="n">600</span></div>
  <div class="sw" style="background:var(--agni-neutral-700);color:#fff"><span class="n">700</span></div>
  <div class="sw" style="background:var(--agni-neutral-800);color:#fff"><span class="n">800</span></div>
  <div class="sw" style="background:var(--agni-neutral-900);color:#fff"><span class="n">900</span></div>
</div>
</body></html>
