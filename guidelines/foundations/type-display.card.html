<!-- @dsCard group="Type" viewport="700x270" name="Display — Plus Jakarta Sans" subtitle="Headings & brand moments. Tight tracking." -->
<!DOCTYPE html><html data-theme="light" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}
.r{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-subtle)}
.r:last-child{border:0}
.t{font-family:var(--font-display);color:var(--text-primary);font-weight:var(--fw-semibold);letter-spacing:var(--tracking-tight)}
.m{font-family:var(--font-data);font-size:var(--text-2xs);color:var(--text-tertiary);margin-left:auto;white-space:nowrap}
.note{font-family:var(--font-sans);font-size:var(--text-xs);color:var(--text-tertiary);margin-top:12px;line-height:var(--leading-snug)}</style></head><body>
<div class="r"><span class="t" style="font-size:var(--text-display)">Launch readiness</span><span class="m">display · 48 / 600</span></div>
<div class="r"><span class="t" style="font-size:var(--text-3xl)">Mission control</span><span class="m">3xl · 36 / 600</span></div>
<div class="r"><span class="t" style="font-size:var(--text-2xl)">Purchase orders</span><span class="m">2xl · 28 / 600</span></div>
<div class="r"><span class="t" style="font-size:var(--text-xl)">Records overview</span><span class="m">xl · 22 / 600</span></div>
<p class="note"><strong>Plus Jakarta Sans</strong> — page titles, section headings &amp; brand moments. Tight tracking, semibold (600). Open-licensed (Google Fonts / SIL OFL). Falls back to Poppins.</p>
</body></html>
